spring:
  application:
    name: payment-router

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

mock:
  gateway:
    max-amount: ${MOCK_GATEWAY_MAX_AMOUNT:500000}